<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>معرض الصور</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f5;
  color: #222;
}

header {
  background: #17324d;
  color: white;
  text-align: center;
  padding: 25px;
}

header h1 {
  margin: 0;
}

nav {
  background: white;
  padding: 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px #0002;
}

nav button {
  border: 0;
  padding: 12px 17px;
  border-radius: 8px;
  background: #e4e8ed;
  cursor: pointer;
  font-size: 15px;
  font-family: inherit;
  transition: 0.2s;
}

nav button:hover,
nav button.active {
  background: #17324d;
  color: white;
}

section {
  display: none;
  max-width: 1200px;
  margin: auto;
  padding: 30px 20px;
}

section.active {
  display: block;
}

section h2 {
  margin-top: 0;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
  background: #d8dde3;
}

.gallery img:hover {
  transform: scale(1.03);
}

.live {
  background: white;
  padding: 20px;
  text-align: center;
  border-radius: 15px;
  box-shadow: 0 2px 10px #0001;
}

.live iframe,
.live .placeholder {
  width: 100%;
  max-width: 800px;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 12px;
  display: block;
  margin: 0 auto;
}

.live .placeholder {
  background: #17324d;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  padding: 20px;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

#viewer.open {
  display: flex;
}

#viewer img {
  max-width: 95%;
  max-height: 90%;
  border-radius: 10px;
}

#close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 45px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
}

@media (max-width: 600px) {

  nav {
    justify-content: flex-start;
    overflow-x: auto;
    flex-wrap: nowrap;
  }

  nav button {
    white-space: nowrap;
  }

  .gallery {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .gallery img {
    height: 160px;
  }

  section {
    padding: 20px 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>معرض الصور</h1>
</header>

<nav>
  <button class="active" onclick="showTab('home', this)">الرئيسية</button>
  <button onclick="showTab('nature', this)">FPV</button>
  <button onclick="showTab('wallpapers', this)">dji</button>
  <button onclick="showTab('cities', this)">موسكيتو</button>
  <button onclick="showTab('sunrise', this)">سومرو</button>
  <button onclick="showTab('night', this)">كالكان</button>
  <button onclick="showTab('misc', this)">صور متنوعة</button>
  <button onclick="showTab('live', this)">البث المباشر</button>
</nav>

<section id="home" class="active">
  <h2>أهلاً وسهلاً 👋</h2>
  <p>مرحباً بك في موقعي الخاص بالصور والبث المباشر.</p>
  <p>استخدم الأزرار في الأعلى للتنقل بين الأقسام، واضغط على أي صورة لتكبيرها.</p>
</section>

<section id="nature">
  <h2>FPV</h2>
  <div class="gallery">
    <img src="https://picsum.photos/600/400?random=1" alt="FPV 1" loading="lazy">
    <img src="https://picsum.photos/600/400?random=2" alt="FPV 2" loading="lazy">
    <img src="https://picsum.photos/600/400?random=3" alt="FPV 3" loading="lazy">
    <img src="https://picsum.photos/600/400?random=4" alt="FPV 4" loading="lazy">
  </div>
</section>

<section id="wallpapers">
  <h2>dji</h2>
  <div class="gallery">
    <img src="https://pin.it/5s3CpbD3f=5" alt="dji 1" loading="lazy">
    <img src="https://www-cdn.djiits.com/cms/uploads/d329577cc39caaa80410aca69027385e@640*640.png=6" alt="dji 2" loading="lazy">
    <img src="https://picsum.photos/600/400?random=7" alt="dji 3" loading="lazy">
    <img src="https://picsum.photos/600/400?random=8" alt="dji 4" loading="lazy">
  </div>
</section>

<section id="cities">
  <h2>موسكيتو</h2>
  <div class="gallery">
    <img src="https://picsum.photos/600/400?random=9" alt="موسكيتو 1" loading="lazy">
    <img src="https://picsum.photos/600/400?random=10" alt="موسكيتو 2" loading="lazy">
    <img src="https://picsum.photos/600/400?random=11" alt="موسكيتو 3" loading="lazy">
    <img src="https://picsum.photos/600/400?random=12" alt="موسكيتو 4" loading="lazy">
  </div>
</section>

<section id="sunrise">
  <h2>سومرو</h2>
  <div class="gallery">
    <img src="https://picsum.photos/600/400?random=13" alt="سومرو 1" loading="lazy">
    <img src="https://picsum.photos/600/400?random=14" alt="سومرو 2" loading="lazy">
    <img src="https://picsum.photos/600/400?random=15" alt="سومرو 3" loading="lazy">
    <img src="https://picsum.photos/600/400?random=16" alt="سومرو 4" loading="lazy">
  </div>
</section>

<section id="night">
  <h2>كالكان</h2>
  <div class="gallery">
    <img src="https://picsum.photos/600/400?random=17" alt="كالكان 1" loading="lazy">
    <img src="https://picsum.photos/600/400?random=18" alt="كالكان 2" loading="lazy">
    <img src="https://picsum.photos/600/400?random=19" alt="كالكان 3" loading="lazy">
    <img src="https://picsum.photos/600/400?random=20" alt="كالكان 4" loading="lazy">
  </div>
</section>

<section id="misc">
  <h2>📷 صور متنوعة</h2>
  <div class="gallery">
    <img src="https://picsum.photos/600/400?random=21" alt="متنوعة 1" loading="lazy">
    <img src="https://picsum.photos/600/400?random=22" alt="متنوعة 2" loading="lazy">
    <img src="https://picsum.photos/600/400?random=23" alt="متنوعة 3" loading="lazy">
    <img src="https://picsum.photos/600/400?random=24" alt="متنوعة 4" loading="lazy">
  </div>
</section>

<section id="live">
  <h2>📺 البث المباشر</h2>
  <div class="live">
    <div class="placeholder">ضع هنا رابط البث المباشر (iframe)</div>
  </div>
</section>

<div id="viewer">
  <span id="close">&times;</span>
  <img id="viewerImg" src="" alt="">
</div>

<script>
function showTab(id, btn) {
  document.querySelectorAll('section').forEach(function (s) {
    s.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');

  document.querySelectorAll('nav button').forEach(function (b) {
    b.classList.remove('active');
  });

  btn.classList.add('active');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

var viewer = document.getElementById('viewer');
var viewerImg = document.getElementById('viewerImg');

function openViewer(src) {
  viewerImg.src = src;
  viewer.classList.add('open');
}

function closeViewer() {
  viewer.classList.remove('open');
  viewerImg.src = '';
}

document.querySelectorAll('.gallery img').forEach(function (img) {
  img.addEventListener('click', function () {
    openViewer(img.src);
  });
});

document.getElementById('close').addEventListener('click', closeViewer);

viewer.addEventListener('click', function (e) {
  if (e.target === viewer) closeViewer();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeViewer();
});
</script>

</body>
</html>
